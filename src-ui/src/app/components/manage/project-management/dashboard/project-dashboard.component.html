<pngx-page-header title="Thống kê công việc" i18n-title [loading]="loading"></pngx-page-header>

<div class="project-management">
  <section class="summary-grid">
    <article class="stat-card">
      <i-bs name="hdd-stack"></i-bs>
      <div>
        <span class="metric">{{ workspaces.length }}</span>
        <span class="metric-label" i18n>Không gian làm việc</span>
      </div>
    </article>
    <article class="stat-card">
      <i-bs name="diagram3"></i-bs>
      <div>
        <span class="metric">{{ projects.length }}</span>
        <span class="metric-label" i18n>Dự án</span>
      </div>
    </article>
    <article class="stat-card">
      <i-bs name="list-task"></i-bs>
      <div>
        <span class="metric">{{ tasks.length }}</span>
        <span class="metric-label" i18n>Công việc</span>
      </div>
    </article>
    <article class="stat-card">
      <i-bs name="check-circle"></i-bs>
      <div>
        <span class="metric">{{ completedTasks }}</span>
        <span class="metric-label" i18n>Đã hoàn thành</span>
      </div>
    </article>
    <article class="stat-card">
      <i-bs name="clock-history"></i-bs>
      <div>
        <span class="metric">{{ openTasks }}</span>
        <span class="metric-label" i18n>Công việc đang mở</span>
      </div>
    </article>
    <article class="stat-card">
      <i-bs name="exclamation-triangle"></i-bs>
      <div>
        <span class="metric">{{ overdueTasks }}</span>
        <span class="metric-label" i18n>Quá hạn</span>
      </div>
    </article>
  </section>

  <section class="summary-band">
    <div class="progress-wrap">
      <div class="d-flex justify-content-between small text-muted">
        <span i18n>Tiến độ công việc</span>
        <span>{{ progress }}%</span>
      </div>
      <div class="progress">
        <div class="progress-bar" [style.width.%]="progress"></div>
      </div>
    </div>
    <div>
      <span class="metric">{{ openIntakeCount }}</span>
      <span class="metric-label" i18n>Yêu cầu tiếp nhận đang mở</span>
    </div>
  </section>
</div>

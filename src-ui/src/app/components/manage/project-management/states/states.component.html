<pngx-page-header title="Quản lý workflow state" i18n-title [loading]="loading"></pngx-page-header>

<div class="project-management">
  <section class="pm-toolbar">
    <div class="selector">
      <label class="form-label" for="workspaceSelect" i18n>Workspace</label>
      <select id="workspaceSelect" class="form-select" [(ngModel)]="selectedWorkspaceId" (ngModelChange)="reloadProjects()">
        @for (workspace of workspaces; track workspace.id) {
          <option [ngValue]="workspace.id">{{ workspace.name }}</option>
        }
      </select>
    </div>
    <div class="selector">
      <label class="form-label" for="projectSelect" i18n>Project</label>
      <select id="projectSelect" class="form-select" [(ngModel)]="selectedProjectId" (ngModelChange)="reloadStates()">
        @for (project of projects; track project.id) {
          <option [ngValue]="project.id">{{ project.key }} · {{ project.name }}</option>
        }
      </select>
    </div>
  </section>

  <section class="form-band">
    <form class="create-form" (ngSubmit)="createState()">
      <h2 i18n>State</h2>
      <input class="form-control" name="stateName" [(ngModel)]="draft.name" placeholder="Name" i18n-placeholder />
      <div class="checks">
        <label class="form-check">
          <input class="form-check-input" type="checkbox" name="stateDefault" [(ngModel)]="draft.is_default" />
          <span class="form-check-label" i18n>Default</span>
        </label>
        <label class="form-check">
          <input class="form-check-input" type="checkbox" name="stateCompleted" [(ngModel)]="draft.is_completed" />
          <span class="form-check-label" i18n>Done</span>
        </label>
      </div>
      <button class="btn btn-sm btn-outline-primary" type="submit" [disabled]="!selectedProjectId">
        <i-bs name="plus-circle" class="me-1"></i-bs><ng-container i18n>Create</ng-container>
      </button>
    </form>
  </section>

  <section class="list-grid">
    @for (state of states; track state.id) {
      <article class="list-card split">
        <div>
          <div class="fw-semibold">{{ state.name }}</div>
          <div class="small text-muted">
            <ng-container i18n>Position</ng-container> {{ state.position }}
            @if (state.is_completed) {
              · <ng-container i18n>Done state</ng-container>
            }
          </div>
        </div>
        <button class="btn btn-sm btn-link" type="button" (click)="setDefaultState(state)" [disabled]="state.is_default">
          @if (state.is_default) {
            <i-bs name="check-circle-fill"></i-bs>
          } @else {
            <i-bs name="circle"></i-bs>
          }
        </button>
      </article>
    }
  </section>
</div>
